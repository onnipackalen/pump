name: CI

on: push

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build the web app
        run: npm run build

      # The exact RTP check: every rung, every Patch, every legal bet.
      - name: RTP proof
        run: npm run rtp

      # Starts a real server, fires overlapping requests, then reconciles the ledger.
      - name: Hammer
        run: npm run hammer
